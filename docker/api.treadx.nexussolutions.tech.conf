# Nginx server block configuration for api.treadx.nexussolutions.tech
# This file should be placed in /etc/nginx/sites-available/
# and symlinked to /etc/nginx/sites-enabled/

# Upstream for Spring Boot application
# Since nginx is running on the host, it connects to localhost:9003
# where the Docker container exposes the Spring Boot app
upstream treadx_backend {
    server localhost:9003;
    keepalive 32;
}

server {
    listen 80;
    server_name api.treadx.nexussolutions.tech;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Client max body size (for file uploads)
    client_max_body_size 100M;

    # Proxy all requests to Spring Boot application
    location / {
        proxy_pass http://treadx_backend;
    }

    # Health check endpoint (if you have one)
    location /actuator/health {
        proxy_pass http://treadx_backend;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
