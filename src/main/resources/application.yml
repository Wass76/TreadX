server:
  port: 9003

spring:
  application:
    name: TreadX
  datasource:
    url: jdbc:postgresql://localhost:5432/treadx
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    tenants:
      n6b:
        url: jdbc:postgresql://localhost:5432/treadx_n6b
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 5
          minimum-idle: 1
      n5v:
        url: jdbc:postgresql://localhost:5432/treadx_n5v
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 5
          minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:/db/migration # This is the default path Flyway looks in
    # If your database already has existing tables not managed by Flyway before,
    # this will create the Flyway history table without running existing scripts.
    # New scripts will then be applied.
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      format_sql: true
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
jwtKey: 7402bb3c24c35f15d1a7f1422078d9c1a4d9ebf1a276ff01ac84e6407625532e

# Dynamic DataSource Configuration (for territory-specific data only)
treadx:
  dynamic-datasource:
    enabled: true  # Temporarily disabled to avoid circular dependency

logging:
  level:
    org.springframework.security: DEBUG